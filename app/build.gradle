plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.optimistopti.mykeyboard'
    compileSdk 35
    defaultConfig {
        applicationId "com.optimistopti.mykeyboard"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "8.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file("../release/keyboard_you.p12")
            storePassword "KeyBoardYou2024"
            keyAlias "keyboard_you"
            keyPassword "KeyBoardYou2024"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Use same signing as release so updates work
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
}
